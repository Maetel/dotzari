<!doctype html>
<html lang="ko" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Dotzari — Child node interaction & authoring lab</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --page: #e8e7e1; --shell: #f7f6f1; --panel: #fff; --panel2: #f0efe9;
      --ink: #222721; --muted: #737a72; --line: #d6d9d2; --strong: #b9beb6;
      --accent: #315ee8; --accent-soft: #e7edff; --warm: #dc6844; --warm-soft: #fff0e9;
      --good: #2f846b; --good-soft: #e5f5ef; --canvas: #f5f4ef; --grid: rgba(47,57,49,.075);
      --edge: #969f97; --shadow: 0 24px 70px rgba(30,38,31,.14), 0 2px 8px rgba(30,38,31,.08);
      --node-shadow: 0 9px 24px rgba(30,38,31,.11), 0 1px 3px rgba(30,38,31,.08);
      font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-theme="midnight"] {
      color-scheme: dark;
      --page: #080b11; --shell: #10151d; --panel: #151b25; --panel2: #0d121a;
      --ink: #f1f4f8; --muted: #929dac; --line: #293340; --strong: #3d4a5b;
      --accent: #7d9dff; --accent-soft: #202b4a; --warm: #ff8b68; --warm-soft: #40251f;
      --good: #63d5ae; --good-soft: #16382f; --canvas: #0b1017; --grid: rgba(183,200,220,.07);
      --edge: #586779; --shadow: 0 30px 90px rgba(0,0,0,.48), 0 2px 12px rgba(0,0,0,.34);
      --node-shadow: 0 12px 28px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.35);
    }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body { overflow-x: hidden; background: var(--page); color: var(--ink); }
    button, input { font: inherit; color: inherit; }
    button { border: 0; }
    .page { min-height: 100vh; padding: 22px; }
    .showcase { max-width: 1440px; margin: 0 auto; }
    .showcase-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin-bottom: 14px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 10px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; overflow-wrap: anywhere; font-size: clamp(27px, 3vw, 42px); line-height: 1.08; letter-spacing: -.045em; }
    .lead { max-width: 790px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .theme-switch, .role-switch { display: flex; flex: 0 0 auto; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
    .theme-switch button, .role-switch button { padding: 7px 11px; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px; font-weight: 850; white-space: nowrap; }
    .theme-switch button.active, .role-switch button.active { background: var(--ink); color: var(--panel); }
    .scenario-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-bottom: 10px; }
    .scenario-card { position: relative; min-width: 0; padding: 10px 10px 9px 36px; border: 1px solid var(--line); border-radius: 11px; background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--muted); text-align: left; cursor: pointer; }
    .scenario-card:hover { border-color: var(--strong); }
    .scenario-card.active { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent); }
    .scenario-no { position: absolute; left: 10px; top: 10px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 6px; background: var(--panel2); color: var(--muted); font-size: 8px; font-weight: 900; }
    .scenario-card.active .scenario-no { background: var(--accent); color: white; }
    .scenario-card strong { display: block; overflow: hidden; font-size: 10px; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .scenario-card span { display: block; margin-top: 3px; overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .scenario-card .audience { color: var(--accent); font-weight: 800; }
    .app-shell { overflow: hidden; border: 1px solid var(--strong); border-radius: 18px; background: var(--shell); box-shadow: var(--shadow); }
    .appbar { display: flex; align-items: center; gap: 11px; height: 55px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; font-size: 13px; font-weight: 900; }
    .brand-mark { position: relative; width: 24px; height: 24px; border-radius: 8px; background: var(--accent); box-shadow: inset -6px -6px rgba(0,0,0,.1); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; border-radius: 50%; background: #fff; }
    .brand-mark::before { left: 6px; top: 6px; width: 5px; height: 5px; }
    .brand-mark::after { right: 5px; bottom: 5px; width: 7px; height: 7px; opacity: .65; }
    .document { min-width: 0; color: var(--muted); font-size: 10px; }
    .document strong { display: block; overflow: hidden; color: var(--ink); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .saved { display: inline-flex; align-items: center; gap: 5px; color: var(--good); font-size: 9px; white-space: nowrap; }
    .saved::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
    .spacer { flex: 1; }
    .icon-btn, .soft-btn, .solid-btn, .tool { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .icon-btn { width: 29px; height: 29px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); }
    .soft-btn, .solid-btn { min-height: 30px; padding: 0 10px; border-radius: 8px; font-size: 9px; font-weight: 850; }
    .soft-btn { background: var(--accent-soft); color: var(--accent); }
    .solid-btn { background: var(--accent); color: white; }
    .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--warm-soft); color: var(--warm); font-size: 9px; font-weight: 900; }
    .surface[hidden] { display: none !important; }

    /* Producer */
    .editor-grid { display: grid; grid-template-columns: 164px minmax(0, 1fr) 236px; grid-template-rows: 42px minmax(360px, 1fr) 148px; height: 610px; }
    .panel { min-width: 0; min-height: 0; background: var(--panel); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 11px; border-bottom: 1px solid var(--line); }
    .panel-head strong { font-size: 10px; }
    .panel-head span { color: var(--muted); font-size: 8px; }
    .slide-panel { grid-column: 1; grid-row: 1 / 4; overflow: hidden; border-right: 1px solid var(--line); }
    .slide-list { display: grid; gap: 8px; max-height: calc(100% - 42px); padding: 9px; overflow-y: auto; }
    .slide-card { position: relative; min-height: 74px; padding: 7px 7px 6px 23px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); text-align: left; cursor: pointer; }
    .slide-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .slide-card::before { content: attr(data-slide); position: absolute; left: 6px; top: 7px; color: var(--muted); font-size: 7px; font-weight: 900; }
    .slide-card strong { display: block; margin-top: 4px; overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .thumb { position: relative; display: block; height: 43px; overflow: hidden; border-radius: 5px; background: var(--canvas); }
    .thumb i { position: absolute; display: block; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
    .slide-add { min-height: 39px; border: 1px dashed var(--strong); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 9px; }
    .toolbar { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 2px; min-width: 0; padding: 5px 8px; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); }
    .tool { flex: 0 0 auto; gap: 4px; height: 29px; padding: 0 7px; border-radius: 7px; background: transparent; color: var(--muted); font-size: 9px; white-space: nowrap; }
    .tool.active, .tool:hover { background: var(--panel2); color: var(--ink); }
    .divider { flex: 0 0 1px; width: 1px; height: 18px; margin: 0 2px; background: var(--line); }
    .canvas { position: relative; grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; overflow: hidden; background-color: var(--canvas); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
    .canvas::after { content: ""; position: absolute; inset: 0; z-index: 8; pointer-events: none; box-shadow: inset 0 1px var(--line), inset -1px 0 var(--line); }
    .canvas-label { position: absolute; left: 12px; top: 12px; z-index: 7; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--muted); font-size: 8px; backdrop-filter: blur(7px); }
    .canvas-label b { color: var(--accent); }
    .edge-layer { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
    .edge-line { fill: none; stroke: var(--edge); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
    .edge-line.active { stroke: var(--accent); stroke-width: 2.2; }
    .edge-label { position: absolute; z-index: 2; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--muted); font-size: 7px; line-height: 1; transform: translate(-50%, -50%); pointer-events: none; }
    .node { position: absolute; z-index: 3; width: var(--w, 142px); min-height: 82px; padding: 11px; overflow: hidden; border: 1px solid var(--strong); border-radius: 11px; background: var(--panel); box-shadow: var(--node-shadow); transform: translate(-50%, -50%); cursor: pointer; transition: width .2s, opacity .2s, border-color .2s, box-shadow .2s; }
    .node:focus-visible, .node.selected { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--node-shadow); }
    .node.dimmed { opacity: .38; }
    .node[data-kind="media"] { border-style: dashed; }
    .node[data-kind="question"] { border-color: var(--warm); }
    .node[data-variant="container"] { overflow: visible; border-color: color-mix(in srgb, var(--accent) 60%, var(--strong)); background: color-mix(in srgb, var(--accent-soft) 42%, var(--panel)); }
    .node[data-variant="code"] { padding: 9px; background: color-mix(in srgb, var(--panel) 90%, var(--canvas)); }
    .node[data-variant="video"], .node[data-variant="image"] { padding: 7px; }
    .node-kicker { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; color: var(--muted); font-size: 7px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
    .node-kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .node[data-kind="data"] .node-kicker::before, .node[data-variant="code"] .node-kicker::before { background: var(--good); }
    .node[data-kind="media"] .node-kicker::before, .node[data-kind="question"] .node-kicker::before { background: var(--warm); }
    .node h3 { margin: 0; font-size: 13px; line-height: 1.15; letter-spacing: -.025em; }
    .node p { margin: 5px 0 0; color: var(--muted); font-size: 8px; line-height: 1.4; }
    .node-foot { display: flex; justify-content: space-between; gap: 6px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 7px; }
    .node-foot b { color: var(--good); }
    .node-children { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-top: 8px; padding: 7px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 8px; background: var(--panel); }
    .node-children-label { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 6px; font-weight: 800; }
    .node-children-label b { color: var(--accent); font-size: 6px; }
    .child-node { position: relative; display: grid; gap: 2px; padding: 6px 5px 6px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--ink); cursor: pointer; font-size: 7px; font-weight: 850; text-align: left; }
    .child-node::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); transform: translateY(-50%); }
    .child-node:hover, .child-node:focus-visible { outline: none; border-color: var(--accent); background: var(--accent-soft); }
    .child-node small { color: var(--accent); font-size: 5.5px; font-weight: 850; }
    .child-node.cluster-member-highlight { box-shadow: 0 0 0 2px var(--accent); }
    .child-mode-bar { display: flex; align-items: center; gap: 2px; margin-left: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
    .child-mode-bar[hidden] { display: none; }
    .child-mode-bar > span { padding: 0 5px; color: var(--muted); font-size: 7px; font-weight: 850; white-space: nowrap; }
    .child-mode-bar button { height: 23px; padding: 0 7px; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 7px; font-weight: 850; white-space: nowrap; }
    .child-mode-bar button:hover, .child-mode-bar button.active { background: var(--panel); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
    .node.drop-target::after { content: "여기에 노드 부품 놓기"; position: absolute; left: 7px; right: 7px; bottom: -23px; padding: 5px; border: 1px dashed var(--accent); border-radius: 6px; background: var(--panel); color: var(--accent); font-size: 6px; font-weight: 850; text-align: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .node.drop-target.drag-over { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--node-shadow); }
    .node.drop-target.drag-over::after { opacity: 1; }
    .composed-parts { display: flex; gap: 4px; margin-top: 7px; padding-top: 6px; overflow: hidden; border-top: 1px dashed var(--line); white-space: nowrap; }
    .composed-parts i { flex: 0 0 auto; padding: 4px 5px; border-radius: 5px; background: var(--warm-soft); color: var(--warm); font-size: 6px; font-style: normal; font-weight: 850; }
    .sub-node-card { position: absolute; z-index: 3; display: grid; align-content: center; width: 88px; min-height: 54px; padding: 9px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); box-shadow: var(--node-shadow); color: var(--ink); text-align: left; transform: translate(-50%, -50%); }
    .sub-node-card strong { font-size: 10px; }
    .sub-node-card small { margin-top: 4px; color: var(--muted); font-size: 6px; line-height: 1.35; }
    .sub-node-card i { margin-top: 5px; color: var(--accent); font-size: 6px; font-style: normal; font-weight: 850; }
    .sub-node-card::before { content: ""; position: absolute; left: 8px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .sub-node-card.cluster-member-highlight { box-shadow: 0 0 0 4px var(--accent-soft), var(--node-shadow); }
    .child-popover-panel { position: absolute; left: 18%; top: 67%; z-index: 6; width: 194px; padding: 11px; border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 40px rgba(0,0,0,.22); transform: translate(-50%, -50%); }
    .child-popover-panel::before { content: ""; position: absolute; left: 50%; top: -7px; width: 12px; height: 12px; border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); background: var(--panel); transform: translateX(-50%) rotate(45deg); }
    .child-popover-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .child-popover-head strong { font-size: 10px; }
    .child-popover-head button { width: 22px; height: 22px; border-radius: 6px; background: var(--panel2); color: var(--muted); cursor: pointer; font-size: 8px; }
    .child-popover-panel p { margin: 5px 0 8px; color: var(--muted); font-size: 7px; line-height: 1.4; }
    .child-popover-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .child-popover-list button { padding: 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--ink); cursor: pointer; font-size: 7px; font-weight: 850; text-align: left; }
    .child-popover-list button:hover, .child-popover-list button:focus-visible { outline: none; border-color: var(--accent); background: var(--accent-soft); }
    .nested-detail-panel { position: absolute; left: 18%; top: 73%; z-index: 6; width: 212px; padding: 11px; border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 40px rgba(0,0,0,.22); transform: translate(-50%, -50%); }
    .nested-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .nested-detail-head span { display: grid; gap: 2px; }
    .nested-detail-head small { color: var(--muted); font-size: 6px; }
    .nested-detail-head strong { font-size: 11px; }
    .nested-detail-head button { width: 22px; height: 22px; border-radius: 6px; background: var(--panel2); color: var(--muted); cursor: pointer; }
    .nested-detail-panel > p { margin: 7px 0; color: var(--muted); font-size: 7px; line-height: 1.45; }
    .nested-detail-examples { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .nested-detail-examples span { padding: 6px; border-radius: 6px; background: var(--panel2); color: var(--ink); font-size: 6px; line-height: 1.35; }
    .nested-detail-action { width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; background: var(--accent); color: white; cursor: pointer; font-size: 7px; font-weight: 850; }
    .child-trigger-badge { display: inline-flex; margin-top: 7px; padding: 4px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 7px; font-weight: 850; }
    .focus-frame { position: absolute; inset: 54px 38px 36px; z-index: 0; border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 18px; background: color-mix(in srgb, var(--accent-soft) 24%, transparent); pointer-events: none; }
    .focus-frame-head { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 7px; }
    .focus-frame-head b { color: var(--accent); }
    .focus-frame-head button { position: relative; z-index: 8; width: 23px; height: 23px; border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; pointer-events: auto; }
    .part-palette { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 9px; }
    .part-item { display: flex; align-items: center; gap: 5px; min-width: 0; padding: 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); cursor: grab; font-size: 7px; font-weight: 850; text-align: left; }
    .part-item:hover, .part-item:focus-visible { outline: none; border-color: var(--accent); background: var(--accent-soft); }
    .part-item.dragging { opacity: .55; cursor: grabbing; box-shadow: 0 7px 18px rgba(0,0,0,.16); transform: scale(.98); }
    .part-item b { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 5px; background: var(--panel2); color: var(--accent); font-size: 7px; }
    .compose-help { margin-top: 8px; padding: 7px; border: 1px dashed var(--strong); border-radius: 7px; color: var(--muted); font-size: 7px; line-height: 1.45; }
    .compose-list { display: flex; gap: 4px; margin-top: 7px; overflow-x: auto; }
    .compose-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 6px; background: var(--good-soft); color: var(--good); font-size: 6px; font-weight: 850; }
    .compose-chip button { width: 15px; height: 15px; border-radius: 4px; background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); cursor: pointer; font-size: 7px; }
    .compose-status { min-height: 18px; margin-top: 7px; color: var(--accent); font-size: 7px; line-height: 1.4; }
    .node-media-preview { position: relative; display: grid; place-items: center; height: 58px; margin-bottom: 7px; overflow: hidden; border-radius: 8px; background: linear-gradient(145deg, #1a2639, #684536); color: white; }
    .node-media-preview.image { background: linear-gradient(155deg, var(--accent-soft), var(--good-soft)); }
    .node-media-preview.image::before, .node-media-preview.image::after { content: ""; position: absolute; border-radius: 50%; background: color-mix(in srgb, var(--accent) 55%, transparent); }
    .node-media-preview.image::before { width: 54px; height: 54px; left: 14px; top: 11px; }
    .node-media-preview.image::after { width: 78px; height: 78px; right: -18px; bottom: -34px; background: color-mix(in srgb, var(--good) 55%, transparent); }
    .node-media-preview b { position: relative; z-index: 2; display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; background: rgba(255,255,255,.92); color: #1a2230; font-size: 9px; }
    .node-media-preview small { position: absolute; right: 6px; bottom: 5px; z-index: 2; padding: 3px 5px; border-radius: 4px; background: rgba(0,0,0,.58); color: white; font-size: 6px; }
    .node-code { margin: 7px 0 0; padding: 8px; overflow: hidden; border-radius: 7px; background: #111821; color: #c9f4df; font: 6.5px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: left; white-space: pre; }
    .node-detail { display: none; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 7px; line-height: 1.45; }
    .node-detail strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 7px; }
    .example-list { display: grid; gap: 3px; }
    .example-list i { padding: 4px 5px; border-radius: 5px; background: var(--panel2); color: var(--ink); font-style: normal; }
    .canvas[data-zoom="detail"] .node-detail { display: block; }
    .canvas[data-zoom="detail"] .node { padding: 12px; }
    .canvas[data-zoom="detail"] .node[data-variant="video"], .canvas[data-zoom="detail"] .node[data-variant="image"] { padding: 8px; }

    function clusterCandidates(s) {

    function pairCost(a,b,s) {
      const distance=Math.hypot(a.x-b.x,a.y-b.y);
      const connected=s.edges.some(edge=>(edge[0]===a.id&&edge[1]===b.id)||(edge[0]===b.id&&edge[1]===a.id));
      return distance-(connected?15:0)-(a.kind===b.kind?10:0);
    }

    function autoGroupNodeIds(s) {
      const nodes=s.nodes;
      if(nodes.length<=2) return [nodes.map(node=>node.id)];
      if(nodes.length===3){
        const pairs=[[0,1],[0,2],[1,2]].sort((a,b)=>pairCost(nodes[a[0]],nodes[a[1]],s)-pairCost(nodes[b[0]],nodes[b[1]],s));
        const pair=pairs[0], rest=[0,1,2].find(index=>!pair.includes(index));
        return [[nodes[pair[0]].id,nodes[pair[1]].id],[nodes[rest].id]];
      }
      if(nodes.length===4){
        const pairings=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
        const best=pairings.sort((a,b)=>a.reduce((sum,pair)=>sum+pairCost(nodes[pair[0]],nodes[pair[1]],s),0)-b.reduce((sum,pair)=>sum+pairCost(nodes[pair[0]],nodes[pair[1]],s),0))[0];
        return best.map(pair=>pair.map(index=>nodes[index].id));
      }
      const sorted=[...nodes].sort((a,b)=>a.x-b.x), groupCount=Math.max(2,Math.ceil(sorted.length/3));
      return Array.from({length:groupCount},(_,index)=>sorted.filter((_,nodeIndex)=>nodeIndex%groupCount===index).map(node=>node.id));
    }

      if(/Node\.js/.test(text)&&/Runtime/.test(text)) return 'Node.js 실행 환경';
      if(/질문/.test(text)) return '이해 확인';
      return titles.slice(0,2).join(' · ');
    }

      const x=overrides.x??n.x, y=overrides.y??(state.zoom===140&&n.y<40?n.y+12:n.y), width=overrides.w??(state.zoom===140?(n.detailW||n.w):n.w);
      const extraClass=(n.id==='node'&&state.scenario===0?' drop-target':'')+(clusterIncludes(n.id)?' cluster-member-highlight':'');
      return `<article tabindex="0" role="button" aria-label="${escapeHtml(n.title)} 노드" class="node diagram-item${extraClass} ${i===state.step?'selected':i>state.step+1?'dimmed':''}" data-node-id="${n.id}" data-kind="${n.kind}" data-variant="${n.variant||'standard'}" style="left:${x}%;top:${y}%;--w:${width}px"><span class="node-kicker">${escapeHtml(n.kicker)}</span>${n.variant==='video'||n.variant==='image'?nodeExtras({...n,code:null,children:null,examples:null}):''}<h3>${escapeHtml(n.title)}</h3><p>${n.bodyHtml||escapeHtml(n.body)}</p>${n.variant==='video'||n.variant==='image'?nodeExtras({...n,variant:null}):nodeExtras(n)}<span class="node-foot"><span>${escapeHtml(n.foot)}</span><b>${escapeHtml(n.reuse)}</b></span></article>`;
    }

    function childNodeMarkup(id,title,description,x,y,w=88) {
      return `<button class="sub-node-card diagram-item ${clusterIncludes(id)?'cluster-member-highlight':''}" data-node-id="${id}" data-child-detail="${escapeHtml(title)}" aria-label="${escapeHtml(title)} 상세 보기" style="left:${x}%;top:${y}%;width:${w}px"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(description)}</small><i>자세히 보기 →</i></button>`;
    }

    function childDetailMarkup(id) {
      const detail=childDetails[id];
      if(!detail) return '';
      return `<aside class="nested-detail-panel" id="nestedDetailPanel"><div class="nested-detail-head"><span><small>${escapeHtml(detail.role)}</small><strong>${escapeHtml(detail.title)}</strong></span><button id="closeNestedDetail" aria-label="${escapeHtml(detail.title)} 상세 닫기">×</button></div><p>${escapeHtml(detail.description)}</p><div class="nested-detail-examples">${detail.examples.map(example=>`<span>${escapeHtml(example)}</span>`).join('')}</div><button class="nested-detail-action" id="openChildFocus">하위 구조에서 크게 보기</button></aside>`;
    }

    function conceptArrangement(s) {
      if(state.childView==='focus'){
        const parent=s.nodes.find(n=>n.id==='node');
        return `<div class="focus-frame"><div class="focus-frame-head"><span>실행 구조 / <b>Node.js 하위 구조</b></span><button id="closeFocus" aria-label="집중 보기 닫기">×</button></div></div>${baseNodeMarkup({...parent,children:null},1,{x:50,y:31,w:184})}${childNodeMarkup('child-npm','npm','패키지 설치·실행',35,69,112)}${childNodeMarkup('child-npx','npx','일회성 명령 실행',65,69,112)}${childDetailMarkup(state.childDetail)}`;
      }
      let html=s.nodes.map((n,i)=>baseNodeMarkup(n,i,n.id==='node'&&state.childView==='inside'&&state.composedParts.length?{y:70}:{})).join('');
      if(state.childView==='around') html+=childNodeMarkup('child-npm','npm','패키지 설치·실행',29,70)+childNodeMarkup('child-npx','npx','일회성 명령 실행',71,70);
      if(state.childView==='popover'&&state.childPopover) html+=`<aside class="child-popover-panel" id="childPopoverPanel"><div class="child-popover-head"><strong>Node.js의 하위 노드</strong><button id="closeChildPopover" aria-label="하위 노드 닫기">×</button></div><div class="child-popover-list"><button data-child-detail="npm">npm<br><small>패키지 관리 →</small></button><button data-child-detail="npx">npx<br><small>명령 실행 →</small></button></div></aside>`;
      html+=childDetailMarkup(state.childDetail);
      return html;
    }

    function addPart(part) {
      if(!partLabels[part]) return;
      if(!state.composedParts.includes(part)) state.composedParts.push(part);
      state.lastComposeAction=`${partLabels[part]}${partParticles[part]} Node.js에 추가했습니다.`;
      renderEditor(scenarios[state.scenario]);
    }

    function wireComposition() {
      const parent=$('[data-node-id="node"]');
      if(!parent||state.scenario!==0) return;
      parent.addEventListener('dragover',event=>{event.preventDefault();parent.classList.add('drag-over');});
      parent.addEventListener('dragleave',()=>parent.classList.remove('drag-over'));
      parent.addEventListener('drop',event=>{event.preventDefault();parent.classList.remove('drag-over');addPart(event.dataTransfer.getData('text/plain'));});
    }

    function wireNodeInteractions(s) {
      $$('.node').forEach((node,i) => {
        const select=()=>{state.step=Math.min(i,s.steps.length-1);if(s.id==='concept'&&node.dataset.nodeId==='node'&&state.childView==='popover')state.childPopover=true;renderEditor(s);};
        node.addEventListener('click',select);
        node.addEventListener('keydown',event=>{if(event.target!==node)return;if(event.key==='Enter'||event.key===' '){event.preventDefault();select();}});
        if(s.id==='concept'&&node.dataset.nodeId==='node'&&state.childView==='popover') node.addEventListener('mouseenter',()=>{if(!state.childPopover){state.childPopover=true;renderEditor(s);}});
      });
      $('#closeChildPopover')?.addEventListener('click',event=>{event.stopPropagation();state.childPopover=false;renderEditor(s);});
      $('#closeFocus')?.addEventListener('click',()=>{state.childView='inside';renderEditor(s);});
      $$('[data-child-detail]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();state.childDetail=button.dataset.childDetail;renderEditor(s);}));
      $('#closeNestedDetail')?.addEventListener('click',event=>{event.stopPropagation();state.childDetail=null;renderEditor(s);});
      $('#openChildFocus')?.addEventListener('click',event=>{event.stopPropagation();state.childView='focus';state.childDetail=null;renderEditor(s);});
      $('#returnToClusters')?.addEventListener('click',()=>{state.clusterInspectId=null;setZoom(60);});
      wireComposition();
    }

    function renderNodes(s) {
      const canvas=$('#canvas'), zoomName=state.zoom===60?'overview':state.zoom===140?'detail':'normal';
      canvas.dataset.zoom=zoomName;
      if(state.zoom===60){renderClusters(s);}else{
        $('#nodeLayer').innerHTML=s.id==='concept'?conceptArrangement(s):s.nodes.map((n,i)=>baseNodeMarkup(n,i)).join('');
        if(state.clusterInspectId){const cluster=suggestedClusters(s).find(item=>item.id===state.clusterInspectId);if(cluster)$('#nodeLayer').insertAdjacentHTML('beforeend',`<div class="cluster-inspect-guide"><b>“${escapeHtml(cluster.title)}” 구성 확인 중</b><span>제안된 노드를 강조했습니다.</span><button id="returnToClusters">묶음으로 돌아가기</button></div>`);}
        wireNodeInteractions(s);
      }
      $('#zoomReset').textContent=`${state.zoom}%`;
      $('#zoomMode').textContent=state.zoom===60?'앱이 제안한 묶음':state.zoom===140?'상세 내용 펼침':s.id==='concept'?({inside:'부모 안에 담기',around:'주변에 펼치기',popover:'필요할 때 열기',focus:'하위 구조 집중'}[state.childView]):'개별 노드';
      requestAnimationFrame(drawEdges);
    }

    function anchorPoint(rect, target, canvasRect) {
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2, tx=target.left+target.width/2, ty=target.top+target.height/2;
      const dx=tx-cx, dy=ty-cy, scale=1/Math.max(Math.abs(dx)/(rect.width/2),Math.abs(dy)/(rect.height/2));
      return {x:cx+dx*scale-canvasRect.left, y:cy+dy*scale-canvasRect.top};
    }

    function canvasEdges(s) {
      if(state.zoom===60){const clusters=suggestedClusters(s);return clusters.slice(0,-1).map((cluster,index)=>[cluster.id,clusters[index+1].id,'자동 요약']);}
      if(s.id==='concept'&&state.childView==='focus') return [['node','child-npm','포함'],['node','child-npx','포함']];
      if(s.id==='concept'&&state.childView==='around') return [...s.edges,['node','child-npm','도구'],['node','child-npx','도구']];
      return s.edges;
    }

    function drawEdges() {
      const s=scenarios[state.scenario], canvas=$('#canvas'), svg=$('#edgeLayer');
      if (!canvas || $('#producerSurface').hidden) return;
      const cr=canvas.getBoundingClientRect(); svg.setAttribute('viewBox',`0 0 ${cr.width} ${cr.height}`); svg.innerHTML='';
      $$('.edge-label').forEach(el=>el.remove());
      canvasEdges(s).forEach((edge,i) => {
        const a=$(`[data-node-id="${edge[0]}"]`), b=$(`[data-node-id="${edge[1]}"]`); if(!a||!b)return;
        const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect(), p1=anchorPoint(ar,br,cr), p2=anchorPoint(br,ar,cr), bend=Math.max(20,Math.abs(p2.x-p1.x)*.35);
        const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',`M ${p1.x} ${p1.y} C ${p1.x+bend} ${p1.y}, ${p2.x-bend} ${p2.y}, ${p2.x} ${p2.y}`); path.setAttribute('class',`edge-line ${i<state.step?'active':''}`); path.dataset.source=edge[0]; path.dataset.target=edge[1]; path.dataset.x1=p1.x; path.dataset.y1=p1.y; path.dataset.x2=p2.x; path.dataset.y2=p2.y; svg.appendChild(path);
        const label=document.createElement('span'); label.className='edge-label'; label.textContent=edge[2]; label.style.left=`${(p1.x+p2.x)/2}px`; label.style.top=`${(p1.y+p2.y)/2}px`; canvas.appendChild(label);
      });
    }

    function renderClusterReview(s) {
      const clusters=suggestedClusters(s), candidates=clusterCandidates(s);
      if(!state.selectedClusterId||!clusters.some(c=>c.id===state.selectedClusterId)) state.selectedClusterId=clusters[0]?.id||null;
      const selected=clusters.find(c=>c.id===state.selectedClusterId);
      $('#assetPanelTitle').textContent='자동 묶음 검토';
      $('#assetPanelCount').textContent=`${clusters.length}개 제안`;
      $('.search').style.display='none';
      $('#assetList').innerHTML=`<div class="cluster-review-list">${clusters.map(c=>`<button class="cluster-review-item ${c.id===state.selectedClusterId?'active':''}" data-review-cluster="${c.id}"><strong>${escapeHtml(c.title)}</strong><small>${c.memberIds.length||c.members.length}개 노드 · ${escapeHtml(c.reason)}</small></button>`).join('')}</div>`;
      if(!selected){$('#selectedAsset').innerHTML='';return;}
      $('#selectedAsset').innerHTML=`<p class="label">선택한 묶음 제안</p><h4>이름과 구성을 확인하세요</h4><p>앱이 먼저 묶었지만, 설명 의도에 맞게 언제든 고칠 수 있습니다.</p><div class="cluster-name-row"><input id="clusterNameInput" aria-label="묶음 이름" value="${escapeHtml(selected.title)}"><button id="saveClusterName">이름 저장</button></div><div class="cluster-member-editor">${candidates.map(candidate=>`<label><input type="checkbox" data-cluster-member="${candidate.id}" ${selected.memberIds.includes(candidate.id)?'checked':''}>${escapeHtml(candidate.title)}</label>`).join('')}</div><button class="cluster-inspect-action" id="inspectCluster">확대해서 원래 노드에서 확인</button><div class="cluster-review-status">${escapeHtml(state.clusterStatus||'가까운 위치, 연결 관계, 노드 내용을 바탕으로 제안했습니다.')}</div>`;
      $$('[data-review-cluster]').forEach(button=>button.addEventListener('click',()=>{state.selectedClusterId=button.dataset.reviewCluster;state.clusterStatus='다른 묶음을 선택했습니다.';renderEditor(s);}));
      $('#saveClusterName')?.addEventListener('click',()=>{const value=$('#clusterNameInput').value.trim();if(value)state.clusterNames[selected.id]=value;state.clusterStatus=value?'묶음 이름을 저장했습니다.':'이름을 입력해 주세요.';renderEditor(s);});
      $$('[data-cluster-member]').forEach(input=>input.addEventListener('change',()=>{const current=new Set(selected.memberIds);input.checked?current.add(input.dataset.clusterMember):current.delete(input.dataset.clusterMember);state.clusterMemberOverrides[selected.id]=[...current];state.clusterStatus='포함할 노드를 반영했습니다.';renderEditor(s);}));
      $('#inspectCluster')?.addEventListener('click',()=>{state.clusterInspectId=selected.id;state.zoom=100;renderEditor(s);});
    }

    function renderAssets(s) {
      if(state.zoom===60){renderClusterReview(s);return;}
      $('#assetPanelTitle').textContent='노드 라이브러리';
      $('.search').style.display='flex';
      $('#assetPanelCount').textContent=`${s.assets.length}개`;
      $('#assetList').innerHTML=s.assets.map((a,i)=>`<button class="asset ${i===0?'active':''}"><b class="asset-icon">${escapeHtml(a[1])}</b><span><strong>${escapeHtml(a[0])}</strong><small>${escapeHtml(a[2])}</small></span><i class="asset-count">${escapeHtml(a[3])}</i></button>`).join('');
      if(s.id==='concept'){
        const parts=[['text','T','설명'],['child','◇','하위 노드'],['image','▧','이미지'],['code','</>','코드'],['example','≡','예시']];
        $('#selectedAsset').innerHTML=`<p class="label">Node.js 구성</p><h4>내용 부품</h4><div class="part-palette">${parts.map(part=>`<button class="part-item" data-part="${part[0]}" title="Node.js에 추가"><b>${part[1]}</b>${part[2]}</button>`).join('')}</div><div class="compose-list">${state.composedParts.map(part=>`<span class="compose-chip">${escapeHtml(partLabels[part])}<button data-remove-part="${part}" aria-label="${escapeHtml(partLabels[part])} 제거">×</button></span>`).join('')}</div><div class="compose-status">${escapeHtml(state.lastComposeAction||'아직 추가한 부품이 없습니다.')}</div>`;
        $$('.part-item').forEach(item=>{
          item.addEventListener('pointerdown',event=>{
            if(event.button!==0) return;
            const start={x:event.clientX,y:event.clientY}; let moved=false;
            item.classList.add('dragging');
            const move=pointer=>{
              if(Math.hypot(pointer.clientX-start.x,pointer.clientY-start.y)>6)moved=true;
              const target=document.elementFromPoint(pointer.clientX,pointer.clientY)?.closest('[data-node-id="node"]');
              $('[data-node-id="node"]')?.classList.toggle('drag-over',!!target);
            };
            const up=pointer=>{
              document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
              item.classList.remove('dragging');
              const target=document.elementFromPoint(pointer.clientX,pointer.clientY)?.closest('[data-node-id="node"]');
              $('[data-node-id="node"]')?.classList.remove('drag-over');
              if(moved&&target)addPart(item.dataset.part);
            };
            document.addEventListener('pointermove',move); document.addEventListener('pointerup',up,{once:true});
          });
          item.addEventListener('click',()=>addPart(item.dataset.part));
        });
        $$('[data-remove-part]').forEach(button=>button.addEventListener('click',()=>{state.composedParts=state.composedParts.filter(part=>part!==button.dataset.removePart);state.lastComposeAction=`${partLabels[button.dataset.removePart]}${partParticles[button.dataset.removePart]} 제거했습니다.`;renderEditor(s);}));
      } else {
        $('#selectedAsset').innerHTML=`<p class="label">현재 선택</p><h4>${escapeHtml(s.selected[0])}</h4><p>${escapeHtml(s.selected[1])}</p><button class="asset-action">${escapeHtml(s.selected[2])}</button>`;
      }
    }

    function renderSteps(s) {
      $('#stepCount').textContent=`${s.steps.length}단계`; $('#narrativeSummary').textContent=s.producer;
      $('#steps').innerHTML=s.steps.map((step,i)=>`<button class="step ${i===state.step?'active':''}" data-step="${i+1}"><strong>${escapeHtml(step[0])}</strong><p>${escapeHtml(step[1])}</p><span class="step-tags"><span>${escapeHtml(step[2])}</span><span>${i%2?'0.6초':'클릭'}</span></span></button>`).join('');
      $$('#steps .step').forEach((btn,i)=>btn.addEventListener('click',()=>{state.step=i;renderEditor(s);}));
    }

    function renderChildModeBar(s) {
      const visible=s.id==='concept'&&state.zoom!==60;
      $('#childModeBar').hidden=!visible;
      $$('[data-child-mode]').forEach(button=>button.classList.toggle('active',button.dataset.childMode===state.childView));
    }

    function renderEditor(s) {
      const childHints={inside:'Node.js 안에 하위 도구 표시',around:'npm·npx를 주변 노드로 표시',popover:'하위 도구를 접은 상태',focus:'Node.js 하위 구조에 집중'};
      const hints={60:`60% · 앱이 ${s.nodes.length}개 노드에서 ${suggestedClusters(s).length}개 묶음을 제안했습니다`,100:s.id==='concept'?childHints[state.childView]:s.hint,140:s.id==='concept'?`${childHints[state.childView]} · 상세 정보 펼침`:'140% · 예시·코드·미디어 정보까지 펼쳤습니다'};
      $('#canvasMode').textContent=`${s.mode} · ${state.zoom===60?'전체 보기':state.zoom===140?'상세 보기':'기본 보기'}`; $('#canvasHint').textContent=hints[state.zoom]; renderChildModeBar(s); renderSlides(s); renderNodes(s); renderAssets(s); renderSteps(s); bindConceptReferences($('#producerSurface'));
    }

    function setZoom(value) {
      state.zoom=Math.max(60,Math.min(140,value));
      state.childDetail=null;
      if(state.zoom===60) state.clusterInspectId=null;
      renderEditor(scenarios[state.scenario]);
    }

    function viewerChildDetailMarkup(id) {
      const detail=childDetails[id];
      if(!detail) return '';
      return `<aside class="viewer-child-sheet viewer-detail-sheet"><header><span><small>${escapeHtml(detail.role)}</small><br><b>${escapeHtml(detail.title)}</b></span><button id="closeViewerChildDetail" aria-label="${escapeHtml(detail.title)} 상세 닫기">×</button></header><p>${escapeHtml(detail.description)}</p><ul>${detail.examples.map(example=>`<li>${escapeHtml(example)}</li>`).join('')}</ul><button class="viewer-detail-action" id="viewerChildFocus">하위 구조에서 크게 보기</button></aside>`;
    }

    function viewerEdgeMarkup(edges) {
      return `<svg class="viewer-edge-layer" aria-hidden="true">${edges.map(([source,target,active])=>`<path class="viewer-edge-path ${active?'hot':''}" data-viewer-edge-source="${escapeHtml(source)}" data-viewer-edge-target="${escapeHtml(target)}"></path>`).join('')}</svg>`;
    }

    function drawViewerEdges() {
      $$('.viewer-diagram').forEach(diagram=>{
        const svg=diagram.querySelector('.viewer-edge-layer');
        if(!svg)return;
        const diagramRect=diagram.getBoundingClientRect();
        svg.setAttribute('viewBox',`0 0 ${diagramRect.width} ${diagramRect.height}`);
        svg.querySelectorAll('[data-viewer-edge-source]').forEach(path=>{
          const source=diagram.querySelector(`[data-viewer-node-id="${path.dataset.viewerEdgeSource}"]`);
          const target=diagram.querySelector(`[data-viewer-node-id="${path.dataset.viewerEdgeTarget}"]`);
          if(!source||!target)return;
          const sourceRect=source.getBoundingClientRect(), targetRect=target.getBoundingClientRect();
          const start=anchorPoint(sourceRect,targetRect,diagramRect), end=anchorPoint(targetRect,sourceRect,diagramRect);
          path.setAttribute('d',`M ${start.x} ${start.y} L ${end.x} ${end.y}`);
          path.dataset.x1=start.x; path.dataset.y1=start.y; path.dataset.x2=end.x; path.dataset.y2=end.y;
        });
      });
    }

    function conceptViewer(s) {
      if(state.childView==='inside') return `<div class="viewer-diagram">${viewerEdgeMarkup([['node-runtime','node-v8',true],['node-runtime','node-stack',true],['node-runtime','node-libuv',state.step>1],['node-runtime','node-loop',state.step>2]])}<span class="v-node compact hot" data-viewer-node-id="node-v8" style="left:16%;top:16%">V8<br><small>코드 실행</small></span><span class="v-node compact hot" data-viewer-node-id="node-stack" style="left:84%;top:16%">Call Stack<br><small>함수 순서</small></span><span class="v-node compact ${state.step>1?'hot':''}" data-viewer-node-id="node-libuv" style="left:16%;top:84%">libuv<br><small>I/O 처리</small></span><span class="v-node compact ${state.step>2?'hot':''}" data-viewer-node-id="node-loop" style="left:84%;top:84%">Event Loop<br><small>다음 callback</small></span><div class="viewer-parent-node" data-viewer-node-id="node-runtime"><strong>Node.js</strong><em>V8 + 운영체제 기능</em><small><button class="viewer-nested-child" data-viewer-child-detail="npm"><b>npm</b><i>패키지 관리 →</i></button><button class="viewer-nested-child" data-viewer-child-detail="npx"><b>npx</b><i>명령 실행 →</i></button></small></div>${viewerChildDetailMarkup(state.viewerChildDetail)}</div>`;
      if(state.childView==='around') return `<div class="viewer-diagram">${viewerEdgeMarkup([['node-runtime','node-npm',true],['node-runtime','node-npx',true]])}<span class="v-node hot" data-viewer-node-id="node-runtime" style="left:50%;top:34%">Node.js</span><button class="v-node hot" data-viewer-node-id="node-npm" data-viewer-child-detail="npm" style="left:28%;top:72%">npm<br><small>패키지 관리 →</small></button><button class="v-node hot" data-viewer-node-id="node-npx" data-viewer-child-detail="npx" style="left:72%;top:72%">npx<br><small>명령 실행 →</small></button>${viewerChildDetailMarkup(state.viewerChildDetail)}</div>`;
      if(state.childView==='popover') return `<div class="viewer-diagram"><button class="viewer-child-trigger" id="viewerChildTrigger">Node.js<br><small>하위 도구 2개 ⌄</small></button>${state.viewerChildOpen&&!state.viewerChildDetail?'<aside class="viewer-child-sheet"><header><b>Node.js의 하위 도구</b><button id="closeViewerChildren">×</button></header><div><button class="viewer-child-option" data-viewer-child-detail="npm">npm<br><small>패키지 관리 →</small></button><button class="viewer-child-option" data-viewer-child-detail="npx">npx<br><small>명령 실행 →</small></button></div></aside>':''}${viewerChildDetailMarkup(state.viewerChildDetail)}</div>`;
      return `<div class="viewer-focus-wrap"><div class="viewer-focus-card"><small>실행 구조 / Node.js</small><h4>Node.js의 하위 도구</h4><div class="viewer-focus-children"><button data-viewer-child-detail="npm"><b>npm</b>패키지의 버전을 결정하고 설치합니다.<br><small>구조 보기 →</small></button><button data-viewer-child-detail="npx"><b>npx</b>패키지의 실행 파일을 한 번 호출합니다.<br><small>구조 보기 →</small></button></div></div>${viewerChildDetailMarkup(state.viewerChildDetail)}</div>`;
    }

    function viewerDiagram(s) {
      const items=s.viewer.diagram||[], edges=items.slice(0,-1).map((_,i)=>[`viewer-seq-${i}`,`viewer-seq-${i+1}`,i<state.step]);
      const compact=items.length>4?'compact':'';
      return `<div class="viewer-diagram">${viewerEdgeMarkup(edges)}${items.map((n,i)=>`<span class="v-node ${compact} ${i<=state.step?'hot':''}" data-viewer-node-id="viewer-seq-${i}" style="left:${n[1]}%;top:${n[2]}%">${escapeHtml(n[0])}</span>`).join('')}</div><div class="explain-card">${escapeHtml(s.steps[state.step][1])}</div>`;
    }

    function learnerContent(s) {
      const v=s.viewer;
      if(v.type==='diagram') return s.id==='concept'?conceptViewer(s):viewerDiagram(s);
      if(v.type==='flow') return viewerDiagram(s)+`<pre class="viewer-code">fetch('/users')\n  → GET /users\n  → 200 JSON</pre>`;
      if(v.type==='recall') return `<div class="viewer-diagram">${viewerEdgeMarkup([['recall-package','recall-cli',true],['recall-package','recall-registry',state.step>0],['recall-cli','recall-node',state.step>1],['recall-registry','recall-tree',state.step>1],['recall-tree','recall-modules',state.step>2]])}<span class="v-node compact hot" data-viewer-node-id="recall-package" style="left:50%;top:16%">package.json</span><span class="v-node compact hot" data-viewer-node-id="recall-cli" style="left:18%;top:47%">npm CLI</span><span class="v-node compact ${state.step>0?'hot':''}" data-viewer-node-id="recall-registry" style="left:82%;top:47%">Registry</span><span class="v-node compact ${state.step>1?'hot':''}" data-viewer-node-id="recall-node" style="left:18%;top:82%">Node.js</span><span class="v-node compact ${state.step>1?'hot':''}" data-viewer-node-id="recall-tree" style="left:82%;top:82%">의존성 트리</span><span class="v-node compact ${state.step>2?'hot':''}" data-viewer-node-id="recall-modules" style="left:50%;top:82%">node_modules</span></div><div class="explain-card">npm CLI는 <button class="term-btn" data-concept-ref="package-json">package.json</button>을 읽고 Registry에서 버전을 고른 뒤 패키지를 설치합니다. scripts에 적힌 명령은 <button class="term-btn" data-concept-ref="node-runtime">Node.js 런타임</button>에 전달합니다.</div>`;
      if(v.type==='media') return `<div class="media-box"><button class="media-play" id="mediaPlay" aria-label="영상 재생">${state.playing?'Ⅱ':'▶'}</button><span class="media-caption">${state.playing?'Event Loop가 빈 스택을 확인한 뒤 Queue의 callback을 올립니다.':'파일 읽기는 libuv가 처리하고 JavaScript 실행은 멈추지 않습니다.'}</span></div><div class="media-track"><i style="width:${state.playing?'64':'36'}%"></i></div><div class="explain-card">비동기 작업의 완료와 callback의 실행은 같은 순간이 아닙니다. 완료된 callback도 Call Stack이 빌 때까지 Queue에서 기다립니다.</div>`;
      return `<div class="quiz"><button data-answer="wrong">① 브라우저 안에서만</button><button data-answer="correct">② Node.js 실행 환경에서</button><button data-answer="wrong">③ 데이터베이스 안에서</button></div><div class="feedback" id="feedback" hidden></div>`;
    }

    function renderViewer(s) {
      closeConceptPreview();
      $('#phoneTitle').textContent=s.document; $('#phoneMeta').textContent=s.meta; $('#phoneStepTitle').textContent=s.steps[state.step][0]; $('#phoneStepCount').textContent=`${state.step+1} / ${s.steps.length} 단계`;
      $('#phoneProgress').innerHTML=s.steps.map((_,i)=>`<i class="${i<=state.step?'done':''}"></i>`).join('');
      $('#lessonBody').innerHTML=`<span class="lesson-kicker">${escapeHtml(s.viewer.kicker)}</span><h3>${s.viewer.title}</h3><p>${escapeHtml(s.viewer.intro)}</p>${learnerContent(s)}`;
      requestAnimationFrame(drawViewerEdges);
      bindConceptReferences($('#lessonBody'));
      $('#viewerChildTrigger')?.addEventListener('click',()=>{state.viewerChildOpen=true;renderViewer(s);});
      $('#closeViewerChildren')?.addEventListener('click',()=>{state.viewerChildOpen=false;renderViewer(s);});
      $$('[data-viewer-child-detail]').forEach(button=>button.addEventListener('click',()=>{state.viewerChildDetail=button.dataset.viewerChildDetail;renderViewer(s);}));
      $('#closeViewerChildDetail')?.addEventListener('click',()=>{state.viewerChildDetail=null;renderViewer(s);});
      $('#viewerChildFocus')?.addEventListener('click',()=>{state.childView='focus';state.viewerChildDetail=null;state.viewerChildOpen=false;renderViewer(s);});
      $('#mediaPlay')?.addEventListener('click',()=>{state.playing=!state.playing;renderViewer(s);});
      $$('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{const correct=btn.dataset.answer==='correct';$$('[data-answer]').forEach(b=>b.classList.remove('correct','wrong'));btn.classList.add(correct?'correct':'wrong');const feedback=$('#feedback');feedback.hidden=false;feedback.textContent=correct?'맞았습니다. npm CLI는 package.json의 명령을 읽어 Node.js 프로세스를 시작합니다.':'npm 자체가 JavaScript를 실행하지는 않습니다. package.json에서 명령을 고른 뒤 Node.js 프로세스에 전달합니다.';}));
    }

    function render() {
      const s=scenarios[state.scenario]; renderScenarioStrip(); $('#documentTitle').textContent=s.document; $('#documentMeta').textContent=s.meta;
      renderEditor(s); renderViewer(s); setRole(state.role,false);
    }

    function setRole(role, rerender=true) {
      state.role=role; $('#producerSurface').hidden=role!=='producer'; $('#learnerSurface').hidden=role!=='learner';
      $$('[data-role]').forEach(btn=>btn.classList.toggle('active',btn.dataset.role===role));
      if(rerender){role==='producer'?renderEditor(scenarios[state.scenario]):renderViewer(scenarios[state.scenario]);}
      if(role==='producer') requestAnimationFrame(drawEdges);
    }

    $$('[data-theme-choice]').forEach(btn=>btn.addEventListener('click',()=>{document.documentElement.dataset.theme=btn.dataset.themeChoice;$$('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b===btn));requestAnimationFrame(()=>{drawEdges();drawViewerEdges();});}));
    $$('[data-role]').forEach(btn=>btn.addEventListener('click',()=>setRole(btn.dataset.role)));
    $$('[data-child-mode]').forEach(button=>button.addEventListener('click',()=>{state.childView=button.dataset.childMode;state.childPopover=false;state.childDetail=null;state.viewerChildOpen=false;state.viewerChildDetail=null;if(state.zoom===60)state.zoom=100;renderEditor(scenarios[state.scenario]);if(state.role==='learner')renderViewer(scenarios[state.scenario]);}));
    $('#previewButton').addEventListener('click',()=>setRole('learner'));
    $('#zoomOut').addEventListener('click',()=>setZoom(state.zoom===140?100:60));
    $('#zoomIn').addEventListener('click',()=>setZoom(state.zoom===60?100:140));
    $('#zoomReset').addEventListener('click',()=>setZoom(100));
    $('#canvas').addEventListener('wheel',event=>{if(event.ctrlKey||event.metaKey){event.preventDefault();setZoom(event.deltaY>0?(state.zoom===140?100:60):(state.zoom===60?100:140));}},{passive:false});
    $('#prevStep').addEventListener('click',()=>{state.step=Math.max(0,state.step-1);renderViewer(scenarios[state.scenario]);});
    $('#nextStep').addEventListener('click',()=>{state.step=Math.min(scenarios[state.scenario].steps.length-1,state.step+1);renderViewer(scenarios[state.scenario]);});
    $('#closeConcept').addEventListener('click',()=>closeConceptPreview(true));
    $('#conceptOrigin').addEventListener('click',event=>event.preventDefault());
    document.addEventListener('pointerdown',event=>{if(!$('#conceptPopover').hidden&&!event.target.closest('#conceptPopover')&&!event.target.closest('[data-concept-ref]'))closeConceptPreview();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#conceptPopover').hidden)closeConceptPreview(true);});
    $('#playSteps').addEventListener('click',()=>{state.step=(state.step+1)%scenarios[state.scenario].steps.length;renderEditor(scenarios[state.scenario]);});
    new ResizeObserver(()=>requestAnimationFrame(drawEdges)).observe($('#canvas'));
    new ResizeObserver(()=>requestAnimationFrame(drawViewerEdges)).observe($('#lessonBody'));
    window.addEventListener('resize',()=>{requestAnimationFrame(()=>{drawEdges();drawViewerEdges();});positionConceptPreview();});
    window.addEventListener('scroll',positionConceptPreview,true);
    const initialTheme=previewParams.get('theme');
    if(initialTheme==='paper'||initialTheme==='midnight'){
      document.documentElement.dataset.theme=initialTheme;
      $$('[data-theme-choice]').forEach(button=>button.classList.toggle('active',button.dataset.themeChoice===initialTheme));
    }
    render();
    const initialConcept=previewParams.get('concept');
    if(initialConcept) requestAnimationFrame(()=>{const trigger=$$('[data-concept-ref]').find(item=>item.dataset.conceptRef===initialConcept);if(trigger)openConceptPreview(trigger);});
  </script>
</body>
</html>
